app:
  title: ${ORGANIZATION_NAME}
  baseUrl: ${APP_BASE_URL}

organization:
  name: ${ORGANIZATION_NAME}

backend:
  baseUrl: ${BACKEND_URL}
  listen: ':7007'
  
  database:
    client: better-sqlite3
    connection:
      directory: ./app/data
      # https://node-postgres.com/features/ssl
      # you can set the sslmode configuration option via the `PGSSLMODE` environment variable
      # see https://www.postgresql.org/docs/current/libpq-ssl.html Table 33.1. SSL Mode Descriptions (e.g. require)
      # ssl:
      #   ca: # if you have a CA file and want to verify it you can uncomment this section
      #     $file: <file-path>/ca/server.crt

auth:
  providers:
    guest:
      dangerouslyAllowOutsideDevelopment: true   # replace with a real provider



techdocs:
  builder: external
  publisher:
    type: azureBlobStorage
    azureBlobStorage:
      containerName: ${ CONTAINER_NAME }
      credentials:
        accountName: ${ ACCOUNT_NAME }
        accountKey: ${AZURE_STORAGE_ACCOUNT_KEY}




catalog:
  locations:
    - type: file
      target: ./templates/FastAPI_Backend/template.yaml
      rules:
        - allow: [Component, System, API, Resource, Location, Template]

    
    - type: file 
      target: ./templates/standard_project/template.yaml
      rules:
        - allow: [Component, System, API, Template]
        


integrations:
  github:
    - host: github.com
      token: ${GITHUB_TOKEN}


scaffolder:
  defaultEnvironment:
    parameters:
      githubOrganization: ${GITHUB_ORGANIZATION_NAME}