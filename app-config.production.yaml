app:
  title: ${ORGANIZATION_NAME}
  baseUrl: ${APP_BASE_URL}

organization:
  name: ${ORGANIZATION_NAME}

backend:
  baseUrl: ${BACKEND_URL}
  listen: ':7007'
  database:
    client: pg
    connection:
      host: ${POSTGRES_HOST}
      port: ${POSTGRES_PORT}
      user: ${POSTGRES_USER}
      password: ${POSTGRES_PASSWORD}

auth:
  providers:
    guest:
      dangerouslyAllowOutsideDevelopment: true   # replace with a real provider

techdocs:
  builder: 'external'
  publisher:
    type: 'googleGcs'
    googleGcs:
      bucketName: ${TECHDOCS_GCS_BUCKET}
      projectId: ${PROJECT_ID}
      # credentials:
      #   $file: ${GOOGLE_APPLICATION_CREDENTIALS}

gcsCatalog:
  bucketName: ${TECHDOCS_GCS_BUCKET}
  prefix: synced_data/